name: Android Release APK

on:
  workflow_dispatch:

jobs:
  android:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install customer app dependencies
        working-directory: customer-app
        run: npm ci

      - name: Build web app
        working-directory: customer-app
        run: npm run android:build

      - name: Decode signing keystore
        working-directory: customer-app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > hivedata-release.keystore

      - name: Create signing properties
        working-directory: customer-app/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF
          android.useAndroidX=true
          android.enableJetifier=true
          HIVEDATA_STORE_FILE=hivedata-release.keystore
          HIVEDATA_STORE_PASSWORD=$STORE_PASSWORD
          HIVEDATA_KEY_ALIAS=$KEY_ALIAS
          HIVEDATA_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: customer-app/android
        run: ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: hivedata-release-apk
          path: customer-app/android/app/build/outputs/apk/release/app-release.apk

name: Android Build

on:
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install customer app dependencies
        working-directory: customer-app
        run: npm ci

      - name: Build web app
        working-directory: customer-app
        run: npm run android:build

      - name: Build debug APK
        working-directory: customer-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hivedata-debug-apk
          path: customer-app/android/app/build/outputs/apk/debug/app-debug.apk

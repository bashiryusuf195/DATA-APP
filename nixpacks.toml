# nixpacks.toml — Backend API service build config for Railway (Nixpacks builder).
# Pins the Node.js version and sets the correct build + start lifecycle.
# The worker service uses the same repo/build — override startCommand in Railway UI
# to: npm run worker:prod

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

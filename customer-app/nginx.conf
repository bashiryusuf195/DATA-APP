server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml;

    # ── Service worker ────────────────────────────────────────────────────────
    # Must be served fresh on every request (browsers use byte-diff to detect
    # SW updates). Service-Worker-Allowed: / grants the SW scope over the whole
    # origin — without this header browsers restrict scope to the SW's directory.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control  "no-cache, no-store, must-revalidate";
        add_header Pragma         "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ── Hashed Vite assets — immutable long cache ─────────────────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── index.html — never cached ─────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── SPA fallback — all other paths serve index.html ───────────────────────
    # try_files checks for an actual file first, then falls back to index.html.
    # This means /about → index.html but /favicon.ico → the real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

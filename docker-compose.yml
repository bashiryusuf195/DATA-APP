# ── VTU Platform — Docker Compose ─────────────────────────────────────────────
#
# All secret values come exclusively from .env (git-ignored).
# This file contains NO hardcoded secret values.
#
# Quick start:
#   cp .env.example .env    # fill in required values
#   docker compose up -d
#   docker compose run --rm api npm run migrate:prod
#
# With local Postgres:
#   docker compose --profile local-db up -d

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── API server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # ── Non-secret service overrides (override env_file values) ────────────
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # ── Secrets — values resolved from .env or shell environment ───────────
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      VTPASS_BASE_URL: ${VTPASS_BASE_URL}
      VTPASS_USERNAME: ${VTPASS_USERNAME}
      VTPASS_PASSWORD: ${VTPASS_PASSWORD}
      VTPASS_API_KEY: ${VTPASS_API_KEY}
      VTPASS_PUBLIC_KEY: ${VTPASS_PUBLIC_KEY}
      VTPASS_SECRET_KEY: ${VTPASS_SECRET_KEY}
      # ── Optional with defaults ──────────────────────────────────────────────
      APP_NAME: ${APP_NAME:-vtu-api}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Worker process ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/workers/index.js"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ── Non-secret service overrides ────────────────────────────────────────
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # ── Secrets ─────────────────────────────────────────────────────────────
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      VTPASS_BASE_URL: ${VTPASS_BASE_URL}
      VTPASS_USERNAME: ${VTPASS_USERNAME}
      VTPASS_PASSWORD: ${VTPASS_PASSWORD}
      VTPASS_API_KEY: ${VTPASS_API_KEY}
      VTPASS_PUBLIC_KEY: ${VTPASS_PUBLIC_KEY}
      VTPASS_SECRET_KEY: ${VTPASS_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy

  # ── Local PostgreSQL (optional — use --profile local-db) ──────────────────
  postgres:
    image: postgres:16-alpine
    profiles: [local-db]
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
  postgres-data:

server {
    # ${PORT} is substituted at container startup by the nginx image's envsubst
    # entrypoint. Railway sets $PORT to its internal port (commonly 8080).
    # The ${PORT:-8080} syntax is NOT supported by envsubst — use plain ${PORT}
    # and ensure Railway always injects PORT (it always does for web services).
    listen ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Health check ─────────────────────────────────────────────────────────
    # Railway's healthcheckPath is set to /health in railway.json.
    # This must respond before healthcheckTimeout (30 s) or the deploy fails.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA catch-all ────────────────────────────────────────────────────────
    # All unknown paths serve index.html so React Router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite appends content hashes to JS/CSS filenames — safe to cache forever.
    location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Never cache the HTML entry point ────────────────────────────────────
    # Forces browsers to re-fetch index.html after each deploy so they pick up
    # the new hashed JS/CSS filenames.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

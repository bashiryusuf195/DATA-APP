server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for container orchestrators
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API proxy — only needed when backend and frontend share the same host/port.
    # In production with separate domains, remove these proxy_pass blocks and set
    # VITE_API_BASE_URL at build time instead.
    # location /admin    { proxy_pass http://api:3000; proxy_set_header Host $host; }
    # location /auth     { proxy_pass http://api:3000; proxy_set_header Host $host; }
    # location /wallet   { proxy_pass http://api:3000; proxy_set_header Host $host; }

    # SPA fallback — all unknown paths serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite adds content hashes to filenames)
    location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache the HTML entry point (ensures fresh deploys are picked up)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
